{% extends "base.html" %}

{% block title %}Link expired{% endblock %}

{% block content %}
  <div class="max-w-md mx-auto px-4 py-12">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">That link is invalid or has expired</h1>
    <p class="text-sm text-gray-600">
      Confirmation links expire after 3 days. Sign up again to get a new one.
    </p>
    <p class="mt-4 text-sm text-gray-600">
      <a href="{% url 'account_signup' %}" class="text-accent-700 hover:underline">Sign up
        again</a>
    </p>
  </div>
{% endblock %}
