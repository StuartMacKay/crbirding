# Ruff configuration for crbirding project
target-version = "py314"
line-length = 100
indent-width = 4

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "DJ",  # flake8-django
    "N",   # pep8-naming
    "S",   # flake8-bandit
    "T20", # flake8-print
    "RUF", # ruff-specific rules
]
ignore = [
    "S101",   # Use of assert detected (ok in tests)
    "S105",   # Possible hardcoded password (false positives in settings)
    "S106",   # Possible hardcoded password
    "DJ001",  # Avoid using null=True on string-based fields (we sometimes need it)
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
]

[lint.per-file-ignores]
"config/settings.py" = ["S105", "S106"]
"apps/*/tests.py" = ["S101", "S106", "S311"]
"conftest.py" = ["S101"]

[lint.isort]
known-first-party = ["apps", "config"]
known-third-party = ["django", "celery", "allauth"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
