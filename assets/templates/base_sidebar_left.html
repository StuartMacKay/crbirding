{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="flex flex-col lg:flex-row gap-8">

    <!-- Sidebar (collapses to top on mobile) -->
    <aside
      class="w-full lg:w-64 lg:flex-shrink-0 order-first lg:order-none"
      x-data="{ sidebarOpen: window.innerWidth >= 1024 }"
      x-init="$watch('$store.windowWidth', val => { if (val >= 1024) sidebarOpen = true; })"
    >
      <!-- Mobile sidebar toggle -->
      <div class="lg:hidden mb-2">
        <button
          @click="sidebarOpen = !sidebarOpen"
          type="button"
          class="flex items-center justify-between w-full px-4 py-2 bg-brand-700 text-white rounded-lg text-sm font-medium"
        >
          <span>{% block sidebar_title %}Sidebar{% endblock %}</span>
          <svg
            class="h-4 w-4 transition-transform duration-200"
            :class="sidebarOpen ? 'rotate-180' : ''"
            fill="none" viewBox="0 0 24 24" stroke="currentColor"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
      </div>

      <!-- Sidebar content -->
      <div
        x-show="sidebarOpen"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0 -translate-y-2"
        x-transition:enter-end="opacity-100 translate-y-0"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100 translate-y-0"
        x-transition:leave-end="opacity-0 -translate-y-2"
        class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden"
      >
        <div class="px-4 py-3 bg-brand-50 border-b border-gray-200 hidden lg:block">
          <h2 class="text-sm font-semibold text-brand-800">{% block sidebar_heading %}Navigation{% endblock %}</h2>
        </div>
        <nav class="p-3">
          {% block sidebar_content %}
          <p class="text-sm text-gray-500 px-2 py-1">No sidebar items.</p>
          {% endblock %}
        </nav>
      </div>
    </aside>

    <!-- Main content area -->
    <div class="flex-1 min-w-0">
      {% block main_content %}{% endblock %}
    </div>

  </div>
</div>
{% endblock content %}
