<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- A single colour ring, rendered as a gradient-stroked circle rather
       than a filled disc: the mark is deliberately just the ring
       itself, not a bird, and transparent so it reads on both the light
       page background and the dark nav bar. -->
  <defs>
    <linearGradient id="ring" x1="14" y1="10" x2="86" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="30" fill="none" stroke="url(#ring)" stroke-width="18"/>
</svg>
