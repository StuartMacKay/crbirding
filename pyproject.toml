[project]
name = "crbirding"
version = "0.1.0"
description = "A Django website for managing observations of colour-ringed birds"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "django>=6.0",
  "whitenoise[brotli]>=6.8",
  "gunicorn>=23.0",
  "django-htmx>=1.21",
  "django-browser-reload>=1.16",
  "sentry-sdk[django]>=2.19",
  "django-environ>=0.11",
  "Pillow>=11.0",
  "openpyxl>=3.1.5",
  "requests>=2.34.2",
  "anyascii>=0.3.3",
]

[dependency-groups]
dev = [
  "django-extensions>=3.2",
  "ipython>=8.30",
  "django-debug-toolbar>=4.4",
  "pytest-django>=4.9",
  "factory-boy>=3.3",
  "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "--cov=apps",
  "--cov-report=term-missing",
  "--cov-report=html:htmlcov",
  "-v",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["apps"]
omit = [
  "*/migrations/*",
  "*/tests*",
  "conftest.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
